<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Portal</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;}

.header{
    background:#2c3e50;
    color:white;
    padding:15px;
    text-align:center;
}

/* Jobs */
.jobs{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.job-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.apply-btn{
    margin-top:10px;
    padding:8px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:25px;
    width:350px;
    border-radius:10px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:18px;
}

/* Form */
input{
    width:100%;
    padding:8px;
    margin:6px 0;
}

.upload-box{
    border:2px dashed #3498db;
    padding:10px;
    text-align:center;
    cursor:pointer;
}

button.submit{
    width:100%;
    padding:10px;
    background:#27ae60;
    color:white;
    border:none;
    margin-top:10px;
}

.file-name{
    font-size:12px;
    color:green;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">Job Portal</div>

<div class="jobs" id="jobList"></div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">

        <span class="close" onclick="closeModal()">✖</span>

        <h3 id="jobTitle"></h3>

        <input type="text" id="name" placeholder="Name">
        <input type="text" id="course" placeholder="Course">
        <input type="text" id="session" placeholder="Session (e.g. 2020-2024)">
        <input type="text" id="experience" placeholder="Experience">
        <input type="text" id="skills" placeholder="Skills">

        <div class="upload-box" onclick="selectFile()">
            Upload Resume
            <input type="file" id="resume" hidden>
        </div>

        <div id="fileName" class="file-name"></div>

        <button class="submit" onclick="submitForm()">Apply</button>

    </div>
</div>

<script>

// Jobs Data
const jobs = [
    {id:1, title:"Frontend Developer", company:"Google"},
    {id:2, title:"Backend Developer", company:"Amazon"},
    {id:3, title:"Data Analyst", company:"Microsoft"},
     {id:4, title:"Software Engineer", company:"Infosys"},
      {id:5, title:"Web Developer", company:"TCS"},
    {id:6, title:"System Engineer", company:"Wipro"},
    {id:7, title:"Full Stack Developer", company:"Accenture"},
    {id:8, title:"Cloud Engineer", company:"Capgemini"},
    {id:9, title:"AI Engineer", company:"IBM"},
    {id:10, title:"Java Developer", company:"HCL"},
    {id:11, title:"DevOps Engineer", company:"Tech Mahindra"},
    {id:12, title:"Database Admin", company:"Oracle"},
    {id:13, title:"UI/UX Designer", company:"Adobe"},
    {id:14, title:"React Developer", company:"Meta"},
    {id:15, title:"Streaming Engineer", company:"Netflix"},
    {id:16, title:"E-commerce Developer", company:"Flipkart"},
    {id:17, title:"Payment System Engineer", company:"Paytm"},
    {id:18, title:"Backend API Developer", company:"Zomato"},
    {id:19, title:"App Developer", company:"Swiggy"},
    {id:20, title:"EdTech Developer", company:"Byju's"}
];

// Render Jobs
const jobList = document.getElementById("jobList");

jobs.forEach(job=>{
    jobList.innerHTML += `
        <div class="job-card">
            <h3>${job.title}</h3>
            <p>${job.company}</p>
            <button class="apply-btn" onclick="openModal(${job.id})">
                Apply
            </button>
        </div>
    `;
});

let selectedJob = null;
let fileData = "";

// Open Modal
function openModal(id){
    selectedJob = jobs.find(j=>j.id === id);
    document.getElementById("jobTitle").innerText =
        selectedJob.title + " at " + selectedJob.company;

    document.getElementById("modal").style.display = "flex";
}

// Close Modal
function closeModal(){
    document.getElementById("modal").style.display = "none";
}

// File Select
function selectFile(){
    document.getElementById("resume").click();
}

document.getElementById("resume").addEventListener("change", function(){
    const file = this.files[0];

    if(file){
        document.getElementById("fileName").innerText = file.name;

        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = ()=>{
            fileData = reader.result;
        };
    }
});

// Submit
function submitForm(){

    const data = {
        job: selectedJob,
        name: document.getElementById("name").value,
        course: document.getElementById("course").value,
        session: document.getElementById("session").value,
        experience: document.getElementById("experience").value,
        skills: document.getElementById("skills").value,
        resume: fileData
    };

    if(!data.name || !data.course || !data.session || !data.skills || !fileData){
        alert("Fill all required fields");
        return;
    }

   let allData = JSON.parse(localStorage.getItem("applications")) || [];
allData.push(data);
localStorage.setItem("applications", JSON.stringify(allData));

    alert("Applied Successfully ✅");

    closeModal();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni Portal</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}

body{
    background: linear-gradient(120deg,#1e3c72,#2a5298);
    color:#fff;
}

.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background:rgba(255,255,255,0.1);
}

.navbar button{
    padding:8px 15px;
    border:none;
    background:#00c6ff;
    color:#fff;
    border-radius:20px;
    cursor:pointer;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:none;
}

.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 300px));
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    width:300px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:15px;
    transition:0.3s;
}

.card:hover{ transform:scale(1.05); }

.card p{ margin:5px 0; font-size:14px; }

.connect-btn,.delete-btn{
    margin-top:10px;
    padding:8px 15px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.connect-btn{ background:#00c6ff; color:#fff; }
.delete-btn{ background:#ff4d4d; color:#fff; }

.social{ margin-top:10px; display:none; }

.social a{
    margin-right:10px;
    font-size:18px;
    color:#fff;
}

.social a:hover{ color:#00c6ff; }

.modal{
    position:fixed;
    top:80px;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:flex-start;
    padding-top:40px;
}

.modal-content{
    background:#fff;
    color:#000;
    padding:20px;
    border-radius:15px;
    width:300px;
    max-height:400px;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
}

.modal-content input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>🎓 Alumni Portal</h2>
    <button onclick="openModal()">+ Add Alumni</button>
</div>

<div class="search-box">
    <input type="text" id="search" placeholder="Search alumni...">
</div>

<div class="container" id="alumniList"></div>

<div class="modal" id="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3>Add Alumni</h3>
            <!-- ✅ NEW CLOSE BUTTON -->
            <button onclick="closeModal()">X</button>
        </div>

        <div id="formArea">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="course" placeholder="Course">
            <input type="text" id="session" placeholder="Session">
            <input type="text" id="salary" placeholder="Salary">
            <input type="text" id="location" placeholder="Location">
            <input type="text" id="whatsapp" placeholder="WhatsApp">
            <input type="text" id="linkedin" placeholder="LinkedIn URL">
            <input type="text" id="instagram" placeholder="Instagram URL">
            <input type="email" id="email" placeholder="Email">
            <button onclick="addAlumni()">Add</button>
        </div>

    </div>
</div>

<script>

let alumni = JSON.parse(localStorage.getItem("alumni")) || [];

function saveData(){
    localStorage.setItem("alumni", JSON.stringify(alumni));
}

const nameInput = document.getElementById("name");
const courseInput = document.getElementById("course");
const sessionInput = document.getElementById("session");
const salaryInput = document.getElementById("salary");
const locationInput = document.getElementById("location");
const whatsappInput = document.getElementById("whatsapp");
const linkedinInput = document.getElementById("linkedin");
const instagramInput = document.getElementById("instagram");
const emailInput = document.getElementById("email");

function displayAlumni(data){
    const list=document.getElementById("alumniList");
    list.innerHTML="";
    data.forEach((a,index)=>{
        list.innerHTML+=`
        <div class="card">
            <h3>${a.name}</h3>
            <p><b>Course:</b> ${a.course}</p>
            <p><b>Session:</b> ${a.session}</p>
            <p><b>Salary:</b> ${a.salary}</p>
            <p><b>Location:</b> ${a.location}</p>

            <button class="connect-btn" onclick="toggleSocial(${index})">Connect</button>
            <button class="delete-btn" onclick="deleteAlumni(${index})">Delete</button>

            <div class="social" id="social-${index}">
                ${a.whatsapp?`<a href="https://wa.me/${a.whatsapp}" target="_blank"><i class="fab fa-whatsapp"></i></a>`:""}
                ${a.linkedin?`<a href="${a.linkedin}" target="_blank"><i class="fab fa-linkedin"></i></a>`:""}
                ${a.instagram?`<a href="${a.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>`:""}
                ${a.email?`<a href="mailto:${a.email}"><i class="fas fa-envelope"></i></a>`:""}
            </div>
        </div>`;
    });
}

document.getElementById("search").addEventListener("keyup",function(){
    const value=this.value.toLowerCase();
    displayAlumni(alumni.filter(a =>
        a.name.toLowerCase().includes(value) ||
        a.course.toLowerCase().includes(value) ||
        a.location.toLowerCase().includes(value)
    ));
});

function openModal(){
    document.getElementById("modal").style.display="flex";
}

/* ✅ NEW FUNCTION */
function closeModal(){
    document.getElementById("modal").style.display="none";
}

function addAlumni(){
    alumni.push({
        name: nameInput.value,
        course: courseInput.value,
        session: sessionInput.value,
        salary: salaryInput.value,
        location: locationInput.value,
        whatsapp: whatsappInput.value,
        linkedin: linkedinInput.value,
        instagram: instagramInput.value,
        email: emailInput.value
    });

    saveData();
    displayAlumni(alumni);

    document.querySelectorAll("#formArea input").forEach(i=>i.value="");
    document.getElementById("modal").style.display="none";
}

function deleteAlumni(i){
    if(confirm("Delete this alumni?")){
        alumni.splice(i,1);
        saveData();
        displayAlumni(alumni);
    }
}

function toggleSocial(i){
    let box=document.getElementById(`social-${i}`);
    box.style.display=box.style.display==="block"?"none":"block";
}

let isMin=false;
function toggleMinimize(){
    let form=document.getElementById("formArea");
    form.style.display=isMin?"block":"none";
    isMin=!isMin;
}

displayAlumni(alumni);

</script>

</body>
</html>
